server:
  port: ${PORT:3000}
spring:
  application:
    name: powerzone-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:powerzone}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
  mvc:
    problemdetails:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  api-docs:
    path: /api/docs-json
  swagger-ui:
    path: /api/docs
powerzone:
  seed-demo: ${SEED_DEMO:false}
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:powerzone-access-secret-development-only-change-me}
    refresh-secret: ${JWT_REFRESH_SECRET:powerzone-refresh-secret-development-only-change-me}
    access-seconds: ${JWT_ACCESS_SECONDS:900}
    refresh-seconds: ${JWT_REFRESH_SECONDS:604800}
  ai:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    key: ${AI_SERVICE_API_KEY:internal-ai-key}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  cors-origins: ${CORS_ORIGINS:http://localhost:4200}
