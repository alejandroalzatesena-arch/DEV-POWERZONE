services:
  db:
    image: postgres:16-alpine
    container_name: powerzone-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: powerzone
    ports:
      - "5432:5432"
    volumes:
      - powerzone_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d powerzone"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: powerzone-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - powerzone_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  powerzone_db_data:
  powerzone_redis_data: