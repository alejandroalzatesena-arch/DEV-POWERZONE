services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-powerzone}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - powerzone_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-powerzone}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai:
    build: ./ai-service
    restart: unless-stopped
    environment:
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-internal-ai-key}
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-powerzone}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-powerzone-access-secret-development-only-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-powerzone-refresh-secret-development-only-change-me}
      AI_SERVICE_URL: http://ai:8000
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-internal-ai-key}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
      SEED_DEMO: ${SEED_DEMO:-false}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      THROTTLE_WINDOW_SECONDS: ${THROTTLE_WINDOW_SECONDS:-60}
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  powerzone_db_data:
