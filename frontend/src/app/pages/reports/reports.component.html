<div class="pz-page pz-fade">
  <pz-page-header
    eyebrow="Inteligencia de negocio"
    title="Reportes"
    subtitle="Estadísticas financieras, operativas y de socios."
  />

  <mat-tab-group class="pz-tabs">
    <!-- Financiero -->
    <mat-tab label="Financiero">
      <div class="tab-body">
        <form [formGroup]="financialForm" class="filters" (ngSubmit)="loadFinancial()">
          <mat-form-field appearance="outline"
            ><mat-label>Desde</mat-label><input matInput type="date" formControlName="from"
          /></mat-form-field>
          <mat-form-field appearance="outline"
            ><mat-label>Hasta</mat-label><input matInput type="date" formControlName="to"
          /></mat-form-field>
          <button mat-raised-button class="pz-btn-volt" type="submit">
            <mat-icon>refresh</mat-icon> Actualizar
          </button>
        </form>
        <pz-node-tree [nodes]="financial()" />
      </div>
    </mat-tab>

    <!-- Operativo -->
    <mat-tab label="Operativo">
      <div class="tab-body">
        <pz-node-tree [nodes]="operational()" />
      </div>
    </mat-tab>

    <!-- Membresías -->
    <mat-tab label="Membresías">
      <div class="tab-body">
        <pz-node-tree [nodes]="memberships()" />
      </div>
    </mat-tab>

    <!-- Asistencia -->
    <mat-tab label="Asistencia">
      <div class="tab-body">
        <form [formGroup]="attendanceForm" class="filters" (ngSubmit)="loadAttendance()">
          <mat-form-field appearance="outline"
            ><mat-label>Desde</mat-label><input matInput type="date" formControlName="from"
          /></mat-form-field>
          <mat-form-field appearance="outline"
            ><mat-label>Hasta</mat-label><input matInput type="date" formControlName="to"
          /></mat-form-field>
          <button mat-raised-button class="pz-btn-volt" type="submit">
            <mat-icon>refresh</mat-icon> Actualizar
          </button>
        </form>
        <pz-node-tree [nodes]="attendance()" />
      </div>
    </mat-tab>

    <!-- Progreso de socios -->
    <mat-tab label="Progreso de socios">
      <div class="tab-body">
        <form [formGroup]="progressForm" class="filters" (ngSubmit)="loadProgress()">
          <mat-form-field appearance="outline" style="min-width: 260px">
            <mat-label>Socio</mat-label>
            <mat-select formControlName="userId">
              @for (m of members(); track m.id) {
                <mat-option [value]="m.id">
                  <div class="opt">
                    <span class="mini-avatar">{{ initials(m.firstName, m.lastName) }}</span>
                    {{ m.fullName || m.firstName + ' ' + m.lastName }}
                  </div>
                </mat-option>
              }
            </mat-select>
          </mat-form-field>
          <button
            mat-raised-button
            class="pz-btn-volt"
            type="submit"
            [disabled]="!progressForm.valid"
          >
            <mat-icon>query_stats</mat-icon> Ver progreso
          </button>
        </form>
        <pz-node-tree [nodes]="progress()" />
      </div>
    </mat-tab>
  </mat-tab-group>
</div>
